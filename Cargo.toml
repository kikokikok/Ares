[package]
name = "nova-core-engine"
version = "1.0.0"
edition = "2021"
authors = ["Ares Team <ares@example.com>"]
description = "Nova Core Engine - A high-performance modular game engine"
license = "MIT"
repository = "https://github.com/kikokikok/Ares"
keywords = ["game-engine", "graphics", "performance", "modular"]
categories = ["game-engines", "graphics", "multimedia"]

[workspace]
members = [
    "nova-core",
    "nova-client",
    "nova-server",
    "examples/*"
]

[workspace.dependencies]
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.18", features = ["v4"] }
parking_lot = "0.12"
crossbeam = "0.8"
rayon = "1.11"
dashmap = "6.1"
async-trait = "0.1"
futures = "0.3"
# High-performance serialization for network protocols
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
bytes = "1.10"

[dependencies]
nova-core = { path = "nova-core" }
nova-client = { path = "nova-client" }
nova-server = { path = "nova-server" }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
prost = { workspace = true }
bytes = { workspace = true }

[[bin]]
name = "nova"
path = "src/main.rs"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "engine_benchmark"
harness = false